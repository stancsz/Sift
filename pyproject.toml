[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "sift-context"
version = "0.11.1"
description = "Deterministic, query-aware extractive context compaction"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "stancsz"}]

[project.urls]
Homepage = "https://github.com/stancsz/sift"
Issues = "https://github.com/stancsz/sift/issues"

[project.scripts]
sift = "sift.cli:main"

[project.optional-dependencies]
litellm = ["litellm[proxy]==1.103.0"]
test = ["pytest>=8,<9", "PyYAML>=6,<7"]
client-smoke = ["openai>=1,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
