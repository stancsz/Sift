[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "sift-context"
version = "0.9.0"
description = "Deterministic, query-aware extractive context compaction"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "stancsz"}]

[project.urls]
Homepage = "https://github.com/stancsz/Sift"
Issues = "https://github.com/stancsz/Sift/issues"

[project.optional-dependencies]
litellm = ["litellm[extra-proxy,proxy]==1.103.0"]

[tool.setuptools.packages.find]
where = ["src"]
