[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sift-context"
version = "0.6.0"
description = "Deterministic, query-aware extractive context compaction"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "stancsz"}]

[project.optional-dependencies]
litellm = ["litellm[extra-proxy,proxy]==1.103.0"]

[tool.setuptools.packages.find]
where = ["src"]
