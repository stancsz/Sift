name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable vX.Y.Z tag for rehearsal or publishing; omit for a tagless .devN rehearsal
        required: false
        type: string
      dry_run:
        description: Build and verify without uploading to PyPI
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.ref == 'refs/heads/main' }}
    name: Verify release and build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Validate release selection
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          python scripts/validate_release_selection.py --dry-run "$DRY_RUN" --tag "$RELEASE_TAG"
      - name: Checkout selected stable release tag
        if: ${{ inputs.tag != '' }}
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          git checkout --detach "refs/tags/${RELEASE_TAG}"
          python scripts/validate_release_selection.py --dry-run "$DRY_RUN" --tag "$RELEASE_TAG"
      - name: Check release tag belongs to main
        if: ${{ inputs.tag != '' }}
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          main_commit="$(git rev-parse refs/remotes/origin/main)"
          if ! git merge-base --is-ancestor "$tag_commit" "$main_commit"; then
            echo "::error::release tag must point to a commit reachable from main"
            exit 1
          fi
      - run: python -m pip install -e ".[litellm,test]" build twine
      - run: python -m pytest tests -q
      - run: python benchmarks/compare.py
      - run: python -m build --sdist --wheel
      - run: python -m twine check --strict dist/*
      - name: Smoke-test wheel and source distribution without optional dependencies
        run: |
          for archive in dist/*.whl dist/*.tar.gz; do
            python -m venv "$RUNNER_TEMP/sift-release-$(basename "$archive")"
            venv="$RUNNER_TEMP/sift-release-$(basename "$archive")"
            "$venv/bin/python" -m pip install --no-deps "$archive"
            "$venv/bin/sift" serve --help
            "$venv/bin/python" -c "import importlib.util; assert importlib.util.find_spec('litellm') is None"
          done
      - name: Create distribution checksums
        run: sha256sum dist/*.whl dist/*.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v6
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v6
        with:
          name: distribution-checksums
          path: SHA256SUMS
          if-no-files-found: error
          retention-days: 7
      - name: Report non-publishing rehearsal
        if: ${{ inputs.dry_run }}
        run: |
          echo "Dry run complete: distributions verified; nothing was uploaded to PyPI." >> "$GITHUB_STEP_SUMMARY"

  publish:
    if: ${{ github.ref == 'refs/heads/main' && inputs.dry_run == false }}
    name: Publish distributions
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sift-context
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
