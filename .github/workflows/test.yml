name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    name: Core smoke (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[test]"
      - name: Build and smoke-test the standalone CLI wheel
        run: |
          mkdir -p "$RUNNER_TEMP/sift-wheel"
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/sift-wheel" .
          python -m venv "$RUNNER_TEMP/sift-wheel-venv"
          "$RUNNER_TEMP/sift-wheel-venv/bin/python" -m pip install --no-deps "$RUNNER_TEMP"/sift-wheel/*.whl
          "$RUNNER_TEMP/sift-wheel-venv/bin/sift" serve --help
          "$RUNNER_TEMP/sift-wheel-venv/bin/python" -c "import importlib.util; assert importlib.util.find_spec('litellm') is None"
          "$RUNNER_TEMP/sift-wheel-venv/bin/python" -m unittest discover -s tests -p test_cli.py -q
      - run: python -m unittest discover -s tests -p test_core.py -q
      - run: python -m unittest discover -s tests -p test_invariants.py -q
      - run: python -m unittest discover -s tests -p test_quarantine_rehearsal.py -q
      - run: python -m unittest discover -s tests -p test_cli.py -q
      - run: python -m unittest discover -s tests -p test_site.py -q
      - run: node tests/test_site_demo.js
      - run: python -m pytest tests/test_ollama_compaction_demo.py -q
      - run: python -m pytest tests/test_no_inference_compaction_demo.py -q
      - name: Check frozen benchmark manifest checkout
        run: >-
          python -m pytest -q
          tests/test_analyze_longbench_v2_minimax_fresh_344.py::test_real_tracked_manifest_pins_and_order_are_self_consistent
          tests/test_analyze_longbench_v2_minimax_fresh_344.py::test_frozen_manifest_checkout_pin_is_independent_of_autocrlf

  full-suite:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Full suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[litellm,test]"
      - run: python -m pytest tests -q
      - run: python benchmarks/compare.py
