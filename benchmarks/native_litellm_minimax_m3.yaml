# Three matched native-agent arms. Only minimax-m3-sift is registered with the
# benchmark selector; minimax-m3-full bypasses it through the same OpenRouter model.
model_list:
  - model_name: minimax-m3-full
    model_info:
      max_input_tokens: 1044480
      max_output_tokens: 4096
      context_window: 1048576
    litellm_params: &minimax_m3
      model: openrouter/minimax/minimax-m3
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1
      use_chat_completions_api: true
      stream_options:
        include_usage: true
      reasoning:
        exclude: true
      max_tokens: 4096
      timeout: 120
  - model_name: minimax-m3-sift
    model_info:
      max_input_tokens: 1044480
      max_output_tokens: 4096
      context_window: 1048576
    litellm_params: *minimax_m3

router_settings:
  enable_pre_call_checks: true
  num_retries: 0
  fallbacks: []
  context_window_fallbacks: []

litellm_settings:
  callbacks:
    - native_callback.benchmark_hook
  turn_off_message_logging: true
  set_verbose: false

general_settings:
  master_key: os.environ/SIFT_NATIVE_GATEWAY_KEY
  cancel_on_disconnect: true
